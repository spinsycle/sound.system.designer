[package]
name = "sound-system-designer"
version = "1.4.0"
description = "Design loudspeaker enclosures and whole sound systems"
authors = ["Spinsycle"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "sound_system_designer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-http = { version = "=2.8.3", features = ["unsafe-headers"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
